name: evals

# The AI evals, on the real model (Haiku) with the Anthropic key in the `evals` environment (its own workspace,
# $10/month limit), never given to pull requests from forks. They cost real credits, so they run when asked:
#   pull requests that change AI behaviour (agents, dispatcher, simulator, catalog, migrations): once the PR has the
#     `run-evals` label, which goes on after its last code change; 3 real-model games. Until then the `evals` check
#     fails with a note to add the label, so nothing that changes AI behaviour merges untested. Pull requests that
#     change nothing AI-related (web, Dockerfiles, docs, tests) skip it, which passes.
#   by hand (workflow_dispatch): any branch, any number of games (10 for a slice sign-off).
# Deterministic checks gate: the golden evals' hard checks, the leak attacks on the game master and the quiz
# master, quiz accuracy (no broken question kept), narration's hard checks, and 0 leaks in real-model games.
# Model-graded scores (judges, the host-chat red team) and freshly generated quiz questions report.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      games:
        description: Real-model games to play
        type: number
        default: 3

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: what to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      state: ${{ steps.plan.outputs.state }}
      games: ${{ steps.plan.outputs.games }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'run-evals') }}
          DISPATCH_GAMES: ${{ inputs.games }}
        run: |
          # state: run (play the suite), waiting (AI behaviour changed, no label yet: the check fails), none (skip)
          state=run
          games=3
          case "$EVENT" in
            pull_request)
              if [ "$SAME_REPO" != "true" ]; then
                state=none
              elif ! git diff --name-only "$BASE"...HEAD | grep -qE \
                  '^(services/agents/(src/|evals/|pyproject\.toml|uv\.lock|langgraph\.json)|services/dispatcher/src/|services/catalog/src/|evals/simulator/src/|supabase/migrations/|\.github/workflows/evals\.yml)'; then
                state=none
              elif [ "$LABELLED" != "true" ]; then
                state=waiting
              fi ;;
            workflow_dispatch)
              games=${DISPATCH_GAMES:-3} ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "games=$games" >> "$GITHUB_OUTPUT"
          echo "Evals: $state, real-model games=$games" >> "$GITHUB_STEP_SUMMARY"

  evals:
    name: evals
    needs: plan
    if: needs.plan.outputs.state != 'none'
    runs-on: ubuntu-latest
    environment: evals
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GAMES: ${{ needs.plan.outputs.games }}
      # CI-only internal tokens: the stack here is thrown away after the job.
      AGENTS_SERVICE_TOKEN: ci-agents-token
      CATALOG_SERVICE_TOKEN: ci-catalog-token
      # Attack data goes only to our model provider: no promptfoo cloud generation, telemetry or updates.
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
      PROMPTFOO_DISABLE_UPDATE: "1"
      PROMPTFOO_FAILED_TEST_EXIT_CODE: "0" # model-graded: reports; errors still fail the step
    steps:
      - name: Waiting for the run-evals label
        if: needs.plan.outputs.state == 'waiting'
        run: |
          msg="This PR changes AI behaviour. The real-model evals cost credits, so they run once, when the PR has the run-evals label: add it after the last code change."
          echo "::error::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: uv sync --frozen
        working-directory: services/agents

      - name: Golden evals (hard checks gate; the judge's score reports)
        working-directory: services/agents
        run: uv run python -m evals.run_golden --gate --out golden-results.json

      - name: Leak attacks on the game master (gate)
        working-directory: services/agents
        run: uv run python -m evals.run_leak_attacks --gate --out leak-results.json

      - name: Leak attacks on the quiz master (gate)
        working-directory: services/agents
        run: uv run python -m evals.run_quiz_leak_attacks --gate --out quiz-leak-results.json

      - name: "Quiz accuracy (gate: no broken question kept; fresh questions report)"
        working-directory: services/agents
        run: uv run python -m evals.run_quiz_accuracy --gate --generate cricket "indian food" --out quiz-accuracy-results.json

      - name: Narration (hard checks gate; the judge's score reports)
        working-directory: services/agents
        run: uv run python -m evals.run_narration --gate --out narration-results.json

      - name: Red team on host chat (reports)
        working-directory: services/agents
        run: |
          PROMPTFOO_PYTHON="$PWD/.venv/bin/python" \
            npx -y promptfoo@0.123.1 redteam run -c evals/redteam/promptfooconfig.yaml --no-cache \
            -o evals/redteam/redteam-results.json
          uv run python -m evals.summarise_redteam evals/redteam/redteam-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Start Supabase (only the services the games need)
        run: npx supabase start -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: "Real-model games through the whole pipeline (gate: every game finishes, 0 leaks)"
        run: |
          make agents-dev > agents-dev.log 2>&1 &
          make dispatcher-dev > dispatcher-dev.log 2>&1 &
          for _ in $(seq 90); do
            curl -sf http://127.0.0.1:2024/ok > /dev/null && curl -sf http://127.0.0.1:8134/healthz > /dev/null && break
            sleep 2
          done
          # Keep the simulator's exit code through the pipe: a leak or an unfinished game fails the step.
          set +e
          make simulate GAMES="$GAMES" GM=agents 2>&1 | tee games.log
          status=${PIPESTATUS[0]}
          { echo "## Real-model games"; echo '```'; tail -n 40 games.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Agent Server and dispatcher logs
        if: failure() && needs.plan.outputs.state == 'run'
        run: tail -n 80 agents-dev.log dispatcher-dev.log

      - name: Keep the results
        if: always() && needs.plan.outputs.state == 'run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals
          path: |
            services/agents/golden-results.json
            services/agents/leak-results.json
            services/agents/quiz-leak-results.json
            services/agents/quiz-accuracy-results.json
            services/agents/narration-results.json
            services/agents/evals/redteam/redteam-results.json
            games.log
          retention-days: 30
