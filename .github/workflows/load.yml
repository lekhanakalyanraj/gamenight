name: load

# The load test: many rooms playing at once (each with its own host, TV and bots), mixing the three games, through
# the whole pipeline (dispatcher, Agent Server, narrator, voice) on a fresh local stack. Free: the scripted model
# plays the AI and the voice is a tone. By hand (any size), and weekly. The report, against design.md's targets, goes
# in the run's summary. Fails on any leak or under 98% of games completed; the latency targets fail it only with
# strict (they depend on the runner).

on:
  workflow_dispatch:
    inputs:
      rooms:
        description: Rooms playing at once
        type: number
        default: 25
      games:
        description: Games in all
        type: number
        default: 50
      strict:
        description: Fail when a latency target is missed
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  load:
    name: load test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ROOMS: ${{ inputs.rooms || 25 }}
      GAMES_LOAD: ${{ inputs.games || 50 }}
      STRICT: ${{ inputs.strict && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Start Supabase (only the services the games need)
        run: npx supabase start -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Load the seed files into Storage (Quiz Night's picture rounds)
        run: npx supabase seed buckets
      - name: The pipeline, then the load test
        run: |
          GAMENIGHT_MODEL=fake make agents-dev > agents-dev.log 2>&1 &
          make dispatcher-dev > dispatcher-dev.log 2>&1 &
          GAMENIGHT_VOICE=fake make voice-dev > voice-dev.log 2>&1 &
          for _ in $(seq 90); do
            curl -sf http://127.0.0.1:2024/ok > /dev/null && curl -sf http://127.0.0.1:8134/healthz > /dev/null \
              && curl -sf http://127.0.0.1:8135/healthz > /dev/null && break
            sleep 2
          done
          key=$(npx supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          extra=()
          if [ "$STRICT" = "true" ]; then extra=(--strict); fi
          set +e
          (cd evals/simulator && SUPABASE_PUBLISHABLE_KEY="$key" AGENTS_SERVICE_TOKEN=local-dev-agents-token \
            uv run python -m gamenight_simulator --load "$ROOMS" --games "$GAMES_LOAD" --game mixed \
            --game-master agents --max-players 8 --voice "${extra[@]}" \
            --report-md "$GITHUB_WORKSPACE/load-report.md" --report "$GITHUB_WORKSPACE/load-report.json") \
            > load.log 2>&1
          status=$?
          cat load-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || tail -n 40 load.log >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Pipeline logs
        if: failure()
        run: tail -n 80 load.log agents-dev.log dispatcher-dev.log voice-dev.log || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load
          path: |
            load-report.md
            load-report.json
            load.log
          retention-days: 90
