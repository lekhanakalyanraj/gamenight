name: ci

on:
  push:
    branches: [main]
  pull_request:

# Jobs get only the permissions they ask for.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database:
    name: database (migrations, pgTAP, advisors)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase (only the services the tests need; Storage holds the narration audio)
        run: npx supabase start -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Load the seed files into Storage (Quiz Night's picture rounds)
        run: npx supabase seed buckets
      - run: npx supabase test db
      - name: Security advisors (splinter)
        run: make db-advisors
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Dispatcher against the real outbox (exactly-once, backoff, dead-letter, concurrency, timers)
        working-directory: services/dispatcher
        run: uv run pytest -q tests/test_dispatch_integration.py
      - name: Voice worker against the real queue (voicing, cache, cap, retries, concurrency, clean-up)
        working-directory: services/voice
        run: uv run pytest -q tests/test_worker_integration.py
      - run: make simulator-test
      - name: Game simulator (20 games, scripted game master; fails on any leak or unfinished game)
        run: make simulate GAMES=20
      - name: Quiz Night simulator (10 quizzes; fails on any answer leak, wrong score or unfinished quiz)
        run: make simulate GAMES=10 GAME=quiz
      # The same bots against the real pipeline: dispatcher, Agent Server, the game master graph, the
      # narrator's checks, and the voice service. GAMENIGHT_MODEL=fake plays scripted rules in place of the
      # model and GAMENIGHT_VOICE=fake speaks a tone, so it's free; every line shown must get its clip.
      - name: Game master and voice through the whole pipeline (10 games, scripted model, fake voice)
        run: |
          GAMENIGHT_MODEL=fake make agents-dev > agents-dev.log 2>&1 &
          make dispatcher-dev > dispatcher-dev.log 2>&1 &
          GAMENIGHT_VOICE=fake make voice-dev > voice-dev.log 2>&1 &
          for _ in $(seq 90); do
            curl -sf http://127.0.0.1:2024/ok > /dev/null && curl -sf http://127.0.0.1:8134/healthz > /dev/null \
              && curl -sf http://127.0.0.1:8135/healthz > /dev/null && break
            sleep 2
          done
          make simulate GAMES=10 GM=agents VOICE=1
          make simulate GAMES=5 GM=agents GAME=quiz VOICE=1
      - name: Agent Server, dispatcher and voice logs
        if: failure()
        run: tail -n 80 agents-dev.log dispatcher-dev.log voice-dev.log || true  # absent if an earlier step failed

  web:
    name: web (typecheck, lint, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @gamenight/web
      - run: npm run lint -w @gamenight/web
      - run: npm run build -w @gamenight/web

  agents:
    name: agents (lint, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  e2e:
    name: e2e (a TV and five phones)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: http://127.0.0.1:55421
      # Browsers use a different host than the server, as on a Wi-Fi or in Docker, so e2e would catch
      # the server and browser disagreeing about the login cookie (see lib/supabase/cookie.ts).
      SUPABASE_BROWSER_URL: http://localhost:55421
      # CI-only internal tokens: the stack here is thrown away after the job.
      AGENTS_SERVICE_TOKEN: ci-agents-token
      CATALOG_SERVICE_TOKEN: ci-catalog-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase (auth, REST, Realtime and Storage)
        run: npx supabase start -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Give the app the local stack's publishable key
        run: npx supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/SUPABASE_PUBLISHABLE_KEY=\1/p' >> "$GITHUB_ENV"
      - run: npm run build -w @gamenight/web
      # Playwright also starts the event path: agents (LangGraph dev server, scripted model) and the dispatcher.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e -w @gamenight/web
      - name: Keep the report and traces when it fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  services:
    name: services (dispatcher, voice, catalog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: make services-test

  images:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, agents, dispatcher, voice, catalog]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: make "image-$SERVICE"
        env:
          SERVICE: ${{ matrix.service }}
      - name: Scan (fail on fixable high or critical vulnerabilities)
        run: make "scan-$SERVICE"
        env:
          SERVICE: ${{ matrix.service }}

