version: 2

# Weekly grouped updates. The cooldown skips releases younger than a week, so a hijacked
# package version has time to be caught upstream before it reaches us. Security updates
# ignore the cooldown.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node major we run (22, in CI and locally), not the latest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directories: ["/services/agents", "/services/dispatcher", "/services/voice"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]

  # Base images in every service's Dockerfile (pinned by digest; Dependabot moves the digests).
  - package-ecosystem: docker
    directories: ["/apps/web", "/services/agents", "/services/dispatcher", "/services/voice", "/services/catalog"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
