[project]
name = "gamenight-voice"
version = "0.1.0"
description = "gamenight's voice service: turns approved narration text into audio (slice 4)."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.120",
    "httpx>=0.28",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamenight_voice"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
