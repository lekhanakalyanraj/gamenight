[project]
name = "gamenight-agents"
version = "0.1.0"
description = "gamenight's supervisor and game-master agents, served by the LangGraph Agent Server."
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "langgraph-sdk>=0.2",
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamenight_agents"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
