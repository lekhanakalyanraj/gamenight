[project]
name = "gamenight-dispatcher"
version = "0.1.0"
description = "gamenight's dispatcher: turns outbox events into agent runs and fires phase deadlines (slice 2)."
requires-python = ">=3.12,<3.15"
dependencies = [
    "langgraph-sdk>=0.4",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamenight_dispatcher"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
