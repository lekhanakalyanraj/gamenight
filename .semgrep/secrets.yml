rules:
  - id: gamenight.no-rls-bypass-key
    languages: [typescript, javascript, python]
    severity: ERROR
    message: >-
      Nothing in the apps or agents uses Supabase's service_role key: it bypasses row-level
      security. Hosts and players use their own JWT; agents use the scoped game_master role.
    patterns:
      - pattern-regex: (?i)service[_-]?role
      # Comments may explain the rule; code may not use the key.
      - pattern-not-regex: (?m)^\s*(//|#|\*|/\*).*$

  - id: gamenight.no-secret-in-public-env
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      NEXT_PUBLIC_* variables are bundled into the browser. Keep secrets in server-only
      variables and read them in server code.
    pattern-regex: NEXT_PUBLIC_[A-Z0-9_]*(SECRET|SERVICE|PRIVATE|TOKEN|PASSWORD)
