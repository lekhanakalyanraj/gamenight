[project]
name = "gamenight-simulator"
version = "0.1.0"
description = "gamenight's game simulator: bot players and a game master playing real games through the same APIs as phones."
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "websockets>=14",
]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamenight_simulator"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
